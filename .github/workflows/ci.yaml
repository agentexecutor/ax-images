# Checks for pull requests and main: the license headers. Actions are pinned by
# commit SHA (version in the trailing comment), as the organization's workflow
# security scan requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boilerplate:
    name: License headers
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify/boilerplate.sh

  mock-anthropic:
    name: Fake Anthropic server (selftest & build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run local HTTP selftest
        run: fakes/mock-anthropic/selftest.sh
      - name: Build container image and verify /healthz
        run: |
          docker build -t mock-anthropic:test fakes/mock-anthropic
          cid="$(docker run -d -p 18081:8080 -e EXPECTED_KEY=ci-test-key mock-anthropic:test)"
          trap 'docker rm -f "${cid}" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS -X POST http://127.0.0.1:18081/v1/messages \
            -H "x-api-key: ci-test-key" -H "content-type: application/json" \
            -d '{"model":"claude-mock","messages":[{"role":"user","content":"hi"}]}' | grep -q "MOCK_OK"
