name: antigravity

on:
  pull_request:
    paths:
      - 'agents/antigravity/**'
      - '.github/workflows/antigravity.yaml'
  push:
    branches: [main]
    paths:
      - 'agents/antigravity/**'
      - '.github/workflows/antigravity.yaml'
  workflow_dispatch:
    inputs:
      agy_version:
        description: 'Antigravity CLI version (e.g. latest or 1.5.7)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Launcher unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test ax-harness launcher
        run: agents/antigravity/test_harness.sh
