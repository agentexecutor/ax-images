# Substrate EgressPolicy allowing cleartext HTTP to mock-anthropic:8080 and
# injecting the Secret ax-test/mock-anthropic[key] via k8s-credential-provider.
rules:
  - http:
      hostnames:
        - mock-anthropic.ax-test.svc.cluster.local
        - mock-anthropic.ax-test.svc
      ports:
        numbers:
          - 8080
      effects:
        replaceHeaders:
          - header: x-api-key
            credentialUri: ate-secret://k8s.io/default/ax-test/mock-anthropic/key
          - header: Authorization
            prefix: "Bearer "
            credentialUri: ate-secret://k8s.io/default/ax-test/mock-anthropic/key
