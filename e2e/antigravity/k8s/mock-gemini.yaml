apiVersion: v1
kind: Namespace
metadata:
  name: ax-test
---
apiVersion: v1
kind: Secret
metadata:
  name: mock-gemini
  namespace: ax-test
type: Opaque
stringData:
  # Throwaway test key only -- never store a real API key here.
  key: test-key-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-gemini
  namespace: ax-test
  labels:
    app: mock-gemini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-gemini
  template:
    metadata:
      labels:
        app: mock-gemini
    spec:
      containers:
        - name: mock
          image: MOCK_GEMINI_IMAGE_PLACEHOLDER
          env:
            - name: EXPECTED_KEY
              valueFrom:
                secretKeyRef:
                  name: mock-gemini
                  key: key
            - name: REPLY_TEXT
              value: MOCK_OK
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-gemini
  namespace: ax-test
spec:
  selector:
    app: mock-gemini
  ports:
    - name: http
      port: 8080
      targetPort: 8080
